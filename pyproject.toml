[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dorts9k-mlip-benchmark"
version = "0.1.0"
description = "Evaluation, analysis, and manuscript figures for pretrained MLIPs on DORTS-9K"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "h5py>=3.11,<4", "ase>=3.24,<4"]

[project.optional-dependencies]
analysis = ["pandas>=2.2,<3", "matplotlib>=3.9,<4", "plotly>=6,<8"]
test = ["pytest>=8,<10"]

[project.scripts]
dorts9k = "dorts9k.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
