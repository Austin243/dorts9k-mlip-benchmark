name: Check analysis
on: [push, pull_request]
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r environments/analysis.txt
      - run: pip install '.[analysis,test]'
      - run: pytest -q
      - run: python paper/tables.py
